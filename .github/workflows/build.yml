name: Build

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**/LICENSE'
      - '**/README.md'
      - '**/.gitignore'
      - '**/.gitattributes'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore AssetStudio.sln

      # ================= .NET 8.0 自己完結型発行 =================
      - name: Publish CLI (net8.0-windows / Self-Contained)
        run: dotnet publish AssetStudio.CLI/AssetStudio.CLI.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true --no-restore -o ./publish/net8.0/CLI

      - name: Publish GUI (net8.0-windows / Self-Contained)
        run: dotnet publish AssetStudio.GUI/AssetStudio.GUI.csproj -c Release -f net8.0-windows -r win-x64 --self-contained true --no-restore -o ./publish/net8.0/GUI

      # ================= .NET 10.0 自己完結型発行 =================
      - name: Publish CLI (net10.0-windows / Self-Contained)
        run: dotnet publish AssetStudio.CLI/AssetStudio.CLI.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true --no-restore -o ./publish/net10.0/CLI

      - name: Publish GUI (net10.0-windows / Self-Contained)
        run: dotnet publish AssetStudio.GUI/AssetStudio.GUI.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true --no-restore -o ./publish/net10.0/GUI

      # ================= アーティファクトのアップロード =================
      - name: Upload .NET 8 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-SelfContained-net8.0-${{ github.sha }}
          path: ./publish/net8.0/
          retention-days: 14

      - name: Upload .NET 10 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio-SelfContained-net10.0-${{ github.sha }}
          path: ./publish/net10.0/
          retention-days: 14
